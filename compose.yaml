services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: hunch
      POSTGRES_PASSWORD: hunch_local
      POSTGRES_DB: hunch
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hunch -d hunch"]
      interval: 2s
      timeout: 5s
      retries: 30
volumes:
  postgres_data:
